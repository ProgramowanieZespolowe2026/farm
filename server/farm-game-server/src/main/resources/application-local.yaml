spring:
  server:
    port: 8080
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/<database name>
    username: <username>
    password: <password>

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

  application:
    name: farm-game-server
